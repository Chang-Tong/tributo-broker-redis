name: Provider CI

on:
  push:
  pull_request:

env:
  # Pin the exact Core revision exercised by this provider branch's wheel-only
  # Redis/Ray E2E suite until the compatible Core line is released.
  TRIBUTO_CORE_REPOSITORY: Chang-Tong/Tributo
  TRIBUTO_CORE_REF: 8a08572a47f3017519aa4224db22a27c3243bb36

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout compatible Tributo Core
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TRIBUTO_CORE_REPOSITORY }}
          ref: ${{ env.TRIBUTO_CORE_REF }}
          path: tributo-core
      - name: Build and install Core and provider
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps --wheel-dir dist/core ./tributo-core
          python -m pip install dist/core/tributo-*.whl '.[dev]'
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy src tests/unit
      - name: Suppression check
        run: ./scripts/check_suppressions.sh
      - name: Unit tests
        run: python -m pytest -q tests/unit
      - name: Wheel entry-point discovery
        run: python -m pytest -q tests/integration/test_broker_redis_wheel.py -m integration
      - name: Wheel build
        run: python -m pip wheel --no-deps --wheel-dir dist .
