[project]
name = "tributo-broker-redis"
version = "0.3.0"
description = "Redis Streams provider for Tributo Broker API v1"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "Tributo Contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "tributo>=1.0,<2.0",
    "redis>=6.0,<9.0",
    "pydantic>=2.0,<3.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
contracts = ["jsonschema>=4.23,<5"]
xgboost = [
    "tributo[model-export]>=1.0,<2.0",
    "tributo-algorithms-boosting>=0.1,<1",
]
aimodel-v2 = [
    "tributo[model-export]>=1.0,<2.0",
    "boto3>=1.42.91",
    "clickhouse-connect>=1.5,<1.6",
    "ray-clickhouse>=1.0,<2",
    "tributo-algorithms-boosting>=0.1,<1",
]
dev = [
    "mypy==2.4.1",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "jsonschema>=4.23,<5",
    "types-jsonschema>=4.23",
    "ruff==0.17.3",
]

[project.entry-points."tributo.brokers"]
tributo-redis = "tributo_broker_redis.plugin:RedisBrokerPlugin"

[project.scripts]
tributo-broker-redis = "tributo_broker_redis.cli:main"
tributo-broker-contract = "tributo_broker_redis.contracts.aimodel_v2.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributo_broker_redis"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["conftest", "tributo_broker_redis"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contracts", "tests/aimodel_v2", "tests/integration"]
addopts = "-ra"
markers = [
    "integration: requires a real Redis and/or Docker Ray environment",
    "slow: may take more than two minutes",
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests/unit"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests/integration"]
