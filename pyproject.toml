[project]
name = "tributo-broker-redis"
version = "0.1.0"
description = "Redis Streams broker plugin for Tributo training control-plane jobs"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "Tributo Contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "tributo>=1.1,<2.0",
    "redis>=6.0,<8.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6,<1.0",
]

[project.entry-points."tributo.brokers"]
knova-redis = "tributo_broker_redis.plugin:RedisBrokerPlugin"

[project.scripts]
tributo-broker-redis = "tributo_broker_redis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tributo_broker_redis"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra"
markers = [
    "integration: requires a real Redis and/or Docker Ray environment",
    "slow: may take more than two minutes",
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests/unit"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests/integration"]
